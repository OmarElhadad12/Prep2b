<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>تانية إعدادي – مكتبة المذاكرة</title>
<link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#14213d;--ink2:#1d2e55;--chalk:#ffd23f;--paper:#f7f3e8;--mint:#3ddc97;--rose:#ff6b6b;--text:#f7f3e8;--muted:#a9b4cf;--line:rgba(247,243,232,.12);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body{margin:0;min-height:100%;background:var(--ink);color:var(--text);font-family:'Tajawal',system-ui,sans-serif;
background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:28px 28px}
h1,h2,h3{font-family:'Reem Kufi','Tajawal',sans-serif;margin:0}
.screen{display:none;min-height:100vh;padding:24px 18px 40px;max-width:900px;margin:0 auto}
.screen.on{display:block}
#gate.on{display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
.badge{font-family:'Reem Kufi',sans-serif;font-size:96px;line-height:1;color:var(--chalk);transform:rotate(-6deg);margin-bottom:6px}
.gate-title{font-size:34px;margin-bottom:6px}
.gate-sub{color:var(--muted);margin:0 0 26px}
.box{display:flex;gap:10px;width:100%;max-width:360px}
input{flex:1;min-width:0;padding:14px 16px;border-radius:12px;border:2px solid var(--line);background:var(--ink2);color:var(--text);font-size:18px;font-family:inherit;text-align:center;letter-spacing:3px;-webkit-user-select:text;user-select:text}
input:focus-visible,button:focus-visible,.card:focus-visible{outline:3px solid var(--chalk);outline-offset:2px}
button{cursor:pointer;font-family:inherit}
.go{padding:14px 22px;border:0;border-radius:12px;background:var(--chalk);color:var(--ink);font-weight:700;font-size:17px}
#msg{min-height:26px;margin-top:16px;font-weight:700}
#msg.bad{color:var(--rose)}#msg.ok{color:var(--mint)}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:22px}
.top h2{font-size:28px}
.ghost{background:transparent;border:2px solid var(--line);color:var(--text);padding:9px 16px;border-radius:10px;font-size:15px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.card{position:relative;border:2px solid var(--line);background:var(--ink2);border-radius:18px;padding:22px 18px;text-align:right;color:var(--text);transition:transform .15s,border-color .15s}
.card:hover{transform:translateY(-3px);border-color:var(--c)}
.card .ico{font-size:40px;display:block;margin-bottom:10px}
.card h3{font-size:24px;color:var(--c)}
.card p{margin:6px 0 0;color:var(--muted);font-size:14px}
.card::after{content:"";position:absolute;inset-inline-start:0;top:18px;bottom:18px;width:5px;border-radius:0 5px 5px 0;background:var(--c)}
.list{display:flex;flex-direction:column;gap:12px}
.file{display:flex;align-items:center;gap:12px;padding:16px;border-radius:14px;border:2px solid var(--line);background:var(--ink2);color:var(--text);text-align:right;font-size:17px;width:100%}
.file:hover{border-color:var(--chalk)}
.empty{padding:28px;border:2px dashed var(--line);border-radius:16px;color:var(--muted);text-align:center}
.viewer{position:relative;height:calc(100vh - 150px);min-height:420px;border-radius:14px;overflow:hidden;border:2px solid var(--line);background:#222}
.viewer iframe{width:100%;height:100%;border:0}
.shield{position:absolute;top:0;right:0;width:76px;height:64px;background:var(--ink);z-index:2}
.wm{position:absolute;inset:0;z-index:1;pointer-events:none;display:flex;align-items:center;justify-content:center;font-family:'Reem Kufi',sans-serif;font-size:42px;color:rgba(20,33,61,.07);transform:rotate(-24deg);white-space:nowrap}
@media print{body{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<section id="gate" class="screen on">
  <div class="badge">٢ب</div>
  <h1 class="gate-title">تانية إعدادي</h1>
  <p class="gate-sub">اكتب كلمة السر عشان تدخل</p>
  <div class="box">
    <input id="pw" type="password" inputmode="numeric" autocomplete="off" placeholder="••••••••••" aria-label="كلمة السر">
    <button class="go" id="enter">دخول</button>
  </div>
  <div id="msg" role="status"></div>
</section>

<section id="home" class="screen">
  <div class="top"><h2>اختار المادة</h2><button class="ghost" id="logout">خروج</button></div>
  <div class="grid" id="subjects"></div>
</section>

<section id="files" class="screen">
  <div class="top"><h2 id="subjTitle"></h2><button class="ghost" data-go="home">رجوع</button></div>
  <div class="list" id="fileList"></div>
</section>

<section id="reader" class="screen">
  <div class="top"><h2 id="fileTitle" style="font-size:22px"></h2><button class="ghost" id="backFiles">رجوع</button></div>
  <div class="viewer" id="viewer"></div>
</section>

<script>
/* ===== الإعدادات: عدّل المواد والملفات هنا =====
   id = الجزء الطويل في لينك الملف: drive.google.com/file/d/<ID>/view */
const PASS_HASH = "a5ad7e6d5225ad00c5f05ddb6bb3b1597a843cc92f6cf188490ffcb88a1ef4ef";
const KICK_URL = "https://www.google.com";
const SUBJECTS = [
  {name:"ماث", icon:"∑", color:"#ffd23f", files:[]},
  {name:"ساينس", icon:"⚗", color:"#3ddc97", files:[{title:"كتاب تقييمات الساينس", id:"1aeY7ZwMQMh4TiSGCCX9YFr1EKxEJjm5l"}]},
  {name:"عربي", icon:"ع", color:"#6bb7ff", files:[{title:"تقييمات العربي", id:"1Y7JNzZ82TSdXF20Y00w3ZSup3CL57Qbq"}]},
  {name:"دين", icon:"☪", color:"#c58bff", files:[{title:"إجابات الوحدة الأولى", id:"1rCn6sWIinS-xSGsE0bKO2S5KkqX1oSFZ"}]},
  {name:"دراسات", icon:"🌍", color:"#ff9f6b", files:[]}
  /* مثال ملف: {title:"مذكرة الوحدة الأولى", id:"1AbC..."} */
];

const $ = s => document.querySelector(s);
function show(id){document.querySelectorAll('.screen').forEach(e=>e.classList.toggle('on',e.id===id));window.scrollTo(0,0)}
async function sha(t){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
function authed(){try{return sessionStorage.getItem('p2b')==='1'}catch(e){return false}}

async function tryLogin(){
  const v=$('#pw').value.trim(), m=$('#msg');
  if(!v)return;
  if(await sha(v)===PASS_HASH){
    try{sessionStorage.setItem('p2b','1')}catch(e){}
    m.className='ok';m.textContent='أهلاً بيك ✓';
    setTimeout(()=>{buildHome();show('home')},500);
  }else{
    m.className='bad';m.textContent='كلمة السر غلط – هتتحول بره الموقع';
    $('#pw').disabled=true;
    setTimeout(()=>location.replace(KICK_URL),1400);
  }
}
$('#enter').onclick=tryLogin;
$('#pw').addEventListener('keydown',e=>{if(e.key==='Enter')tryLogin()});
$('#logout').onclick=()=>{try{sessionStorage.removeItem('p2b')}catch(e){};$('#pw').value='';$('#msg').textContent='';show('gate')};
document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>show(b.dataset.go));

let cur=null;
function buildHome(){
  const g=$('#subjects');g.innerHTML='';
  SUBJECTS.forEach((s,i)=>{
    const c=document.createElement('button');c.className='card';c.style.setProperty('--c',s.color);
    c.innerHTML=`<span class="ico">${s.icon}</span><h3>${s.name}</h3><p>${s.files.length?s.files.length+' ملف':'قريباً'}</p>`;
    c.onclick=()=>openSubject(i);g.appendChild(c);
  });
}
function openSubject(i){
  cur=SUBJECTS[i];$('#subjTitle').textContent=cur.name;
  const l=$('#fileList');l.innerHTML='';
  if(!cur.files.length){l.innerHTML='<div class="empty">لسه مفيش ملفات في المادة دي</div>'}
  cur.files.forEach(f=>{
    const b=document.createElement('button');b.className='file';
    b.innerHTML=`<span style="font-size:26px">📄</span><span>${f.title}</span>`;
    b.onclick=()=>openFile(f);l.appendChild(b);
  });
  show('files');
}
function openFile(f){
  $('#fileTitle').textContent=f.title;
  $('#viewer').innerHTML=`<iframe src="https://drive.google.com/file/d/${f.id}/preview" allow="autoplay" referrerpolicy="no-referrer"></iframe><div class="shield"></div><div class="wm">تانية إعدادي ٢ب</div>`;
  show('reader');
}
$('#backFiles').onclick=()=>{$('#viewer').innerHTML='';show('files')};

/* منع كليك يمين والنسخ والطباعة */
['contextmenu','copy','cut','dragstart'].forEach(ev=>document.addEventListener(ev,e=>{if(e.target.tagName!=='INPUT')e.preventDefault()}));
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&['s','p','c','u'].includes(e.key.toLowerCase()))e.preventDefault()});

if(authed()){buildHome();show('home')}
</script>
</body>
</html>
